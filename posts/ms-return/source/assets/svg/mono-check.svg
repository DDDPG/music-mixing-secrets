<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#0066cc" stroke-width="1.4"/></marker></defs><rect width="960" height="620" fill="white"/><g font-family="Noto Sans SC, sans-serif" fill="#1d1d1f"><text x="30" y="48" font-size="32" fill="#1d1d1f" font-weight="600">Mono 检查：Side 的变化可能听不到</text><text x="50" y="145" font-size="42" fill="#0066cc" font-weight="400">L′ = M + H(S)</text><text x="50" y="225" font-size="42" fill="#0066cc" font-weight="400">R′ = M − H(S)</text><path d="M40,270 H920" stroke="#dce3e9" stroke-width="2"/><text x="50" y="350" font-size="48" fill="#1d1d1f" font-weight="600">(L′ + R′) / 2 = M</text><text x="50" y="424" font-size="34" fill="#1d1d1f" font-weight="400">Side 相消；Mid 保留。</text><text x="30" y="510" font-size="25" fill="#697887" font-weight="400">限理想纯 Side 处理，无额外增益、非线性或后级变化。</text><text x="30" y="564" font-size="28" fill="#697887" font-weight="400">Mono 检查不能单独证明“去糊成功”。</text></g></svg>