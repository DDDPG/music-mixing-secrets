<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#0066cc" stroke-width="1.4"/></marker></defs><rect width="960" height="620" fill="white"/><g font-family="Noto Sans SC, sans-serif" fill="#1d1d1f"><text x="30" y="48" font-size="32" fill="#1d1d1f" font-weight="600">M/S 是左右声道的另一种表示</text><rect x="30" y="100" width="420" height="118" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="50" y="144" font-size="30" fill="#1d1d1f" font-weight="600">M = (L + R) / 2</text><text x="50" y="182" font-size="25" fill="#697887" font-weight="400">左右的和</text><rect x="510" y="100" width="420" height="118" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="530" y="144" font-size="30" fill="#1d1d1f" font-weight="600">S = (L − R) / 2</text><text x="530" y="182" font-size="25" fill="#697887" font-weight="400">左右的差</text><path d="M240,220 L240,290" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M720,220 L720,290" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="310" width="420" height="100" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="50" y="354" font-size="30" fill="#1d1d1f" font-weight="600">Mid 保持不变</text><rect x="510" y="310" width="420" height="100" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="530" y="354" font-size="30" fill="#1d1d1f" font-weight="600">仅处理 Side 目标频段</text><text x="90" y="475" font-size="37" fill="#0066cc" font-weight="400">L′ = M + S′</text><text x="550" y="475" font-size="37" fill="#0066cc" font-weight="400">R′ = M − S′</text><text x="30" y="560" font-size="27" fill="#697887" font-weight="400">教学约定：1/2 编码；不是插件内部缩放声明。</text></g></svg>