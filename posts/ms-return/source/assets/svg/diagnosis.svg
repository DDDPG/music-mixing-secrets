<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#0066cc" stroke-width="1.4"/></marker></defs><rect width="960" height="620" fill="white"/><g font-family="Noto Sans SC, sans-serif" fill="#1d1d1f"><text x="30" y="48" font-size="30" fill="#1d1d1f" font-weight="600">先听原因，再选处理 · 诊断示意</text><rect x="30" y="95" width="375" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="50" y="139" font-size="30" fill="#1d1d1f" font-weight="600">湿声整体过多</text><path d="M415,142 L480,142" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="500" y="95" width="430" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="520" y="139" font-size="30" fill="#1d1d1f" font-weight="600">先试降低 Return 电平</text><rect x="30" y="230" width="375" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="50" y="274" font-size="30" fill="#1d1d1f" font-weight="600">Mid / Side 都厚</text><path d="M415,277 L480,277" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="500" y="230" width="430" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="520" y="274" font-size="30" fill="#1d1d1f" font-weight="600">先试 Stereo EQ 或减少湿声</text><rect x="30" y="365" width="375" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="50" y="409" font-size="30" fill="#1d1d1f" font-weight="600">主要 Side 中频过满</text><path d="M415,412 L480,412" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="500" y="365" width="430" height="95" rx="16" fill="#f5f5f7" stroke="#dce3e9"/><text x="520" y="409" font-size="30" fill="#1d1d1f" font-weight="600">再试 Side 频段衰减</text><text x="30" y="552" font-size="28" fill="#697887" font-weight="400">若主要是 Mid 厚，检查湿声 Mid 与干声叠加。</text></g></svg>