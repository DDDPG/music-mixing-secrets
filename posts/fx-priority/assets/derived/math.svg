<svg xmlns="http://www.w3.org/2000/svg" width="936" height="520" viewBox="0 0 936 520"><style>text{font-family:"Noto Sans SC",sans-serif;fill:#1d1d1f;font-size:38px}.small{font-size:28px;fill:#697887}.blue{fill:#0066cc}.line{stroke:#0066cc;stroke-width:5;fill:none}.gray{stroke:#cdd3da;stroke-width:2;fill:none}</style><rect width="936" height="520" fill="#f5f5f7" rx="16"/><text x="40" y="65">理想稳态 · 非实测</text><text x="45" y="130">检测高于阈值</text><text x="520" y="130">阈值以上保留</text><rect x="90" y="175" width="180" height="240" fill="#697887"/><rect x="560" y="295" width="180" height="120" fill="#0066cc"/><path d="M40 415 H875" class="gray"/><text x="135" y="275" style="fill:white;font-size:48px">4 dB</text><text x="595" y="370" style="fill:white;font-size:48px">2 dB</text><text x="340" y="265" class="blue" style="font-size:50px">2:1</text><text x="355" y="325">→</text><text x="40" y="480">GR = 4 × (1 − 1/2) = 2 dB</text></svg>