<svg xmlns="http://www.w3.org/2000/svg" width="936" height="585" viewBox="0 0 936 585"><rect width="936" height="585" fill="#f5f5f7"/><style>text{font-family:Noto Sans SC,sans-serif;fill:#1d1d1f;font-size:30px} .blue{fill:#0066cc} .small{font-size:26px}</style><text x="32" y="48" style="font-size:32px">无再触发 · 线性时序示意</text><line x1="100.0" y1="95" x2="100.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="80.0" y="367" style="font-size:32px">0</text><line x1="292.0" y1="95" x2="292.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="272.0" y="367" style="font-size:32px">80</text><line x1="388.0" y1="95" x2="388.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="368.0" y="367" style="font-size:32px">120</text><line x1="484.0" y1="95" x2="484.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="464.0" y="367" style="font-size:32px">160</text><line x1="676.0" y1="95" x2="676.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="656.0" y="367" style="font-size:32px">240</text><line x1="868.0" y1="95" x2="868.0" y2="325" stroke="#d2d2d7" stroke-width="3" stroke-dasharray=""/><text x="848.0" y="367" style="font-size:32px">320</text><text x="32" y="110" class="">开</text><text x="32" y="310" class="">关</text><text x="768" y="412" style="font-size:32px">时间 / ms</text><polyline points="100,110 484,110 676,310 868,310" fill="none" stroke="#0066cc" stroke-width="7"/><text x="150" y="455" style="font-size:32px">120：满足关闭条件</text><text x="150" y="497" style="font-size:32px">160：Hold 40 ms 后开始 Release</text><text x="150" y="539" style="font-size:32px">240：Release 80 ms 后到达衰减量</text></svg>