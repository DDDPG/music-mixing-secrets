<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><text x="36" y="45" font-size="31" fill="#1d1d1f" text-anchor="start">让亮度服从节奏层次</text><text x="36" y="85" font-size="23" fill="#697887" text-anchor="start">操作顺序示意；不是规定好的电平大小</text><text x="35" y="160" font-size="31" fill="#0066cc" text-anchor="start">01</text><text x="115" y="157" font-size="29" fill="#1d1d1f" text-anchor="start">先调推子</text><text x="115" y="197" font-size="23" fill="#697887" text-anchor="start">整段是否一直太突出？</text><line x1="50" y1="180" x2="50" y2="233" stroke="#ccd6e1" stroke-width="2" /><text x="35" y="265" font-size="31" fill="#0066cc" text-anchor="start">02</text><text x="115" y="262" font-size="29" fill="#1d1d1f" text-anchor="start">再找刺点</text><text x="115" y="302" font-size="23" fill="#697887" text-anchor="start">哪一次击打、哪一段频率？</text><line x1="50" y1="285" x2="50" y2="338" stroke="#ccd6e1" stroke-width="2" /><text x="35" y="370" font-size="31" fill="#0066cc" text-anchor="start">03</text><text x="115" y="367" font-size="29" fill="#1d1d1f" text-anchor="start">选处理方式</text><text x="115" y="407" font-size="23" fill="#697887" text-anchor="start">整段太亮：静态；偶尔刺：可试动态</text><line x1="50" y1="390" x2="50" y2="443" stroke="#ccd6e1" stroke-width="2" /><text x="35" y="475" font-size="31" fill="#0066cc" text-anchor="start">04</text><text x="115" y="472" font-size="29" fill="#1d1d1f" text-anchor="start">回到合奏</text><text x="115" y="512" font-size="23" fill="#697887" text-anchor="start">与人声、Snare 和高潮一起判断</text></g></svg>