<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><text x="36" y="45" font-size="31" fill="#1d1d1f" text-anchor="start">叠加后的峰值，需要重新检查</text><text x="36" y="85" font-size="23" fill="#697887" text-anchor="start">计算例：两个完全相同、同相正弦，各自峰值 −12 dBFS</text><line x1="180" y1="155" x2="850" y2="155" stroke="#e0e4e8" stroke-width="2" /><text x="155" y="163" font-size="23" fill="#697887" text-anchor="end">0</text><line x1="180" y1="239" x2="850" y2="239" stroke="#e0e4e8" stroke-width="2" /><text x="155" y="247" font-size="23" fill="#697887" text-anchor="end">-6</text><line x1="180" y1="323" x2="850" y2="323" stroke="#e0e4e8" stroke-width="2" /><text x="155" y="331" font-size="23" fill="#697887" text-anchor="end">-12</text><line x1="180" y1="407" x2="850" y2="407" stroke="#e0e4e8" stroke-width="2" /><text x="155" y="415" font-size="23" fill="#697887" text-anchor="end">-18</text><rect x="230" y="323" width="80" height="84" rx="0" fill="#697887"/><text x="270" y="452" font-size="27" fill="#1d1d1f" text-anchor="middle">A</text><text x="270" y="305" font-size="23" fill="#1d1d1f" text-anchor="middle">−12 dBFS</text><rect x="445" y="323" width="80" height="84" rx="0" fill="#697887"/><text x="485" y="452" font-size="27" fill="#1d1d1f" text-anchor="middle">B</text><text x="485" y="305" font-size="23" fill="#1d1d1f" text-anchor="middle">−12 dBFS</text><rect x="660" y="238.71160121408525" width="80" height="168.28839878591475" rx="0" fill="#0066cc"/><text x="700" y="452" font-size="27" fill="#1d1d1f" text-anchor="middle">A + B</text><text x="700" y="220.71160121408525" font-size="23" fill="#1d1d1f" text-anchor="middle">-5.98 dBFS</text><text x="36" y="510" font-size="27" fill="#1d1d1f" text-anchor="start">振幅相加：0.251 + 0.251 = 0.502</text><text x="36" y="552" font-size="23" fill="#697887" text-anchor="start">峰值增加 6.02 dB；不是“任意两件乐器相加”的规则。</text></g></svg>