<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><text x="36" y="45" font-size="31" fill="#1d1d1f" text-anchor="start">同一个音，向上延伸的纹理</text><text x="36" y="85" font-size="23" fill="#697887" text-anchor="start">A1 = 55 Hz · 例示前 4 阶谐波，振幅人为设定</text><line x1="152.76355618140116" y1="150" x2="152.76355618140116" y2="420" stroke="#e0e4e8" stroke-width="2" /><text x="152.76355618140116" y="457" font-size="23" fill="#697887" text-anchor="middle">50</text><line x1="434.09701599589107" y1="150" x2="434.09701599589107" y2="420" stroke="#e0e4e8" stroke-width="2" /><text x="434.09701599589107" y="457" font-size="23" fill="#697887" text-anchor="middle">100</text><line x1="715.430475810381" y1="150" x2="715.430475810381" y2="420" stroke="#e0e4e8" stroke-width="2" /><text x="715.430475810381" y="457" font-size="23" fill="#697887" text-anchor="middle">200</text><line x1="880.0" y1="150" x2="880.0" y2="420" stroke="#e0e4e8" stroke-width="2" /><text x="880.0" y="457" font-size="23" fill="#697887" text-anchor="middle">300</text><line x1="105" y1="420" x2="890" y2="420" stroke="#697887" stroke-width="2" /><text x="36" y="145" font-size="22" fill="#697887" text-anchor="start">相对振幅</text><line x1="191.44789825465426" y1="420" x2="191.44789825465426" y2="200" stroke="#0066cc" stroke-width="12" /><text x="191.44789825465426" y="178" font-size="25" fill="#1d1d1f" text-anchor="middle">55 Hz</text><text x="191.44789825465426" y="494" font-size="23" fill="#697887" text-anchor="middle">1 阶</text><line x1="472.7813580691442" y1="420" x2="472.7813580691442" y2="283.6" stroke="#697887" stroke-width="12" /><text x="472.7813580691442" y="261.6" font-size="25" fill="#1d1d1f" text-anchor="middle">110 Hz</text><text x="472.7813580691442" y="494" font-size="23" fill="#697887" text-anchor="middle">2 阶</text><line x1="637.3508822587631" y1="420" x2="637.3508822587631" y2="332.0" stroke="#697887" stroke-width="12" /><text x="637.3508822587631" y="310.0" font-size="25" fill="#1d1d1f" text-anchor="middle">165 Hz</text><text x="637.3508822587631" y="494" font-size="23" fill="#697887" text-anchor="middle">3 阶</text><line x1="754.1148178836343" y1="420" x2="754.1148178836343" y2="362.8" stroke="#697887" stroke-width="12" /><text x="754.1148178836343" y="340.8" font-size="25" fill="#1d1d1f" text-anchor="middle">220 Hz</text><text x="754.1148178836343" y="494" font-size="23" fill="#697887" text-anchor="middle">4 阶</text><text x="36" y="548" font-size="24" fill="#1d1d1f" text-anchor="start">横轴：对数频率。换音时，基频与谐波一起移动。</text><text x="36" y="585" font-size="23" fill="#697887" text-anchor="start">低频层保留重量；上层帮助听清轮廓，不必各自抢主角。</text></g></svg>