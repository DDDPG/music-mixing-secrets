<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><text x="36" y="45" font-size="31" fill="#1d1d1f" text-anchor="start">四次复核，把改动放回音乐</text><text x="36" y="115" font-size="30" fill="#0066cc" text-anchor="start">01</text><text x="120" y="115" font-size="30" fill="#1d1d1f" text-anchor="start">低音量</text><text x="120" y="157" font-size="25" fill="#697887" text-anchor="start">节奏骨架还清楚吗？</text><text x="36" y="230" font-size="30" fill="#0066cc" text-anchor="start">02</text><text x="120" y="230" font-size="30" fill="#1d1d1f" text-anchor="start">Mono</text><text x="120" y="272" font-size="25" fill="#697887" text-anchor="start">有没有异常变薄？</text><text x="36" y="345" font-size="30" fill="#0066cc" text-anchor="start">03</text><text x="120" y="345" font-size="30" fill="#1d1d1f" text-anchor="start">换段落</text><text x="120" y="387" font-size="25" fill="#697887" text-anchor="start">换音、重击、高潮也成立吗？</text><text x="36" y="460" font-size="30" fill="#0066cc" text-anchor="start">04</text><text x="120" y="460" font-size="30" fill="#1d1d1f" text-anchor="start">匹配响度旁通</text><text x="120" y="502" font-size="25" fill="#697887" text-anchor="start">真的更清楚，还是只是更响？</text></g></svg>