<svg xmlns="http://www.w3.org/2000/svg" width="936" height="530" viewBox="0 0 936 530"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans SC, sans-serif"><text x="0" y="45" font-size="34" fill="#1d1d1f" text-anchor="start" font-weight="600">先约定编码，再检查折叠</text><rect x="0" y="95" width="430" height="185" fill="#f5f5f7" rx="8"/><rect x="506" y="95" width="430" height="185" fill="#f5f5f7" rx="8"/><text x="35" y="158" font-size="40" fill="#0066cc" text-anchor="start" font-weight="600">L = M + S</text><text x="35" y="225" font-size="40" fill="#0066cc" text-anchor="start" font-weight="600">R = M − S</text><text x="540" y="158" font-size="32" fill="#1d1d1f" text-anchor="start" font-weight="400">Mono = (L + R) / 2</text><text x="540" y="225" font-size="44" fill="#0066cc" text-anchor="start" font-weight="600">= M</text><text x="0" y="365" font-size="32" fill="#1d1d1f" text-anchor="start" font-weight="400">S 是左右差异项，不等于“两侧乐器”。</text><text x="0" y="423" font-size="31" fill="#1d1d1f" text-anchor="start" font-weight="400">关键旋律应在实际折叠试听中仍然成立。</text><text x="0" y="491" font-size="27" fill="#697887" text-anchor="start" font-weight="400">约定 M=(L+R)/2，S=(L−R)/2；这是代数示意。</text></g></svg>