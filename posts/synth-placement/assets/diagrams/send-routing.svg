887"/><text x="0" y="380" font-size="33" fill="#0066cc" text-anchor="start" font-weight="600">推子 −6 dB → 干声与混响输入一起下降</text><text x="0" y="434" font-size="29" fill="#1d1d1f" text-anchor="start" font-weight="400">要改变相对 Wet，请核对发送点与 Send / Return。</text><text x="0" y="487" font-size="27" fill="#697887" text-anchor="start" font-weight="400">比例推导限近似线性、静态处理；尾声有过渡。</text></g></svg>