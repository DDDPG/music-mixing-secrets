<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">普通音符的时长比较</title>
<desc id="desc">120 BPM：1/8 为 250 ms、1/16 为 125 ms。160 BPM：1/8 为 187.5 ms、1/16 为 93.75 ms。四组使用共同毫秒轴。</desc>
<rect id="background" width="1200" height="660" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">同一音符，速度越快，时长越短</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">普通时值 · 四分音符为一拍 · 固定速度 · 共用毫秒轴</text>
<line x1="288.0" y1="150" x2="288.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-3" x="288.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0</text>
<line x1="429.0" y1="150" x2="429.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-4" x="429.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">50</text>
<line x1="570.0" y1="150" x2="570.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-5" x="570.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">100</text>
<line x1="711.0" y1="150" x2="711.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-6" x="711.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">150</text>
<line x1="852.0" y1="150" x2="852.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-7" x="852.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">200</text>
<line x1="993.0" y1="150" x2="993.0" y2="493" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-8" x="993.0" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">250</text>
<text id="text-9" x="1118" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">ms</text>
<text id="text-10" x="56" y="234.0" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">120</text>
<text id="text-11" x="58" y="267.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">BPM</text>
<text id="text-12" x="252" y="210" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="end">1/8</text>
<line x1="288.0" y1="201" x2="993.0" y2="201" stroke="#0066cc" stroke-width="12" stroke-linecap="round"/>
<circle cx="288.0" cy="201" r="4" fill="#ffffff"/>
<circle cx="993.0" cy="201" r="6" fill="#0066cc"/>
<text id="text-13" x="1013.0" y="210" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">250 ms</text>
<text id="text-14" x="252" y="280" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="end">1/16</text>
<line x1="288.0" y1="271" x2="640.5" y2="271" stroke="#7c8997" stroke-width="12" stroke-linecap="round"/>
<circle cx="288.0" cy="271" r="4" fill="#ffffff"/>
<circle cx="640.5" cy="271" r="6" fill="#7c8997"/>
<text id="text-15" x="660.5" y="280" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">125 ms</text>
<text id="text-16" x="56" y="422.0" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" text-anchor="start">160</text>
<text id="text-17" x="58" y="455.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">BPM</text>
<text id="text-18" x="252" y="398" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="end">1/8</text>
<line x1="288.0" y1="389" x2="816.75" y2="389" stroke="#0066cc" stroke-width="12" stroke-linecap="round"/>
<circle cx="288.0" cy="389" r="4" fill="#ffffff"/>
<circle cx="816.75" cy="389" r="6" fill="#0066cc"/>
<text id="text-19" x="836.75" y="398" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">187.5 ms</text>
<text id="text-20" x="252" y="468" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="end">1/16</text>
<line x1="288.0" y1="459" x2="552.375" y2="459" stroke="#7c8997" stroke-width="12" stroke-linecap="round"/>
<circle cx="288.0" cy="459" r="4" fill="#ffffff"/>
<circle cx="552.375" cy="459" r="6" fill="#7c8997"/>
<text id="text-21" x="572.375" y="468" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">93.75 ms</text>
<text id="text-22" x="56" y="589" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">120 → 160 BPM：同一音符时长缩短 25%</text>
<text id="text-23" x="56" y="634" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">1/8 = 60,000 ÷ BPM ÷ 2</text>
<text id="text-24" x="626" y="634" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">1/16 = 60,000 ÷ BPM ÷ 4</text>
</svg>