<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc">
<title id="title">H-Delay 试听起点清单</title>
<desc id="desc">M&gt;S 或 Stereo；PING PONG 开；HOST 普通 1/8；Feedback 20；Dry/Wet 5；HiPASS 200 Hz；LoPASS 6 kHz。Analog OFF、LoFi 关、Depth 0、ØL/ØR 关。不是官方预设。</desc>
<rect id="background" width="1200" height="695" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">试听起点 · 按显示值记录</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">独立参数清单，不是插件截图或官方预设</text>
<line x1="56" y1="196" x2="1144" y2="196" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-3" x="56" y="160" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">组件</text>
<text id="text-4" x="433" y="160" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">M&gt;S / Stereo</text>
<text id="text-5" x="845" y="160" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">单声道输入 / 立体声输入</text>
<line x1="56" y1="272" x2="1144" y2="272" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-6" x="56" y="236" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">PING PONG</text>
<text id="text-7" x="433" y="236" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">开</text>
<text id="text-8" x="845" y="236" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">确认左右输出</text>
<line x1="56" y1="348" x2="1144" y2="348" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-9" x="56" y="312" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">同步 / 音符</text>
<text id="text-10" x="433" y="312" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">HOST · 普通 1/8</text>
<text id="text-11" x="845" y="312" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">无 D / T 后缀</text>
<line x1="56" y1="424" x2="1144" y2="424" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-12" x="56" y="388" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">FEEDBACK / DRY/WET</text>
<text id="text-13" x="433" y="388" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">20 / 5</text>
<text id="text-14" x="845" y="388" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">插件显示值</text>
<line x1="56" y1="500" x2="1144" y2="500" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-15" x="56" y="464" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="start">HiPASS / LoPASS</text>
<text id="text-16" x="433" y="464" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">200 Hz / 6 kHz</text>
<text id="text-17" x="845" y="464" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">一次只改一个截止点</text>
<text id="text-18" x="56" y="564" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">减少变量</text>
<text id="text-19" x="260" y="564" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">ANALOG OFF · LoFi 关 · MODULATION DEPTH 0</text>
<text id="text-20" x="260" y="603" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start">ØL / ØR 关</text>
<text id="text-21" x="56" y="667" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">整组为试听起点；留意输出峰值，避免削波。</text>
</svg>