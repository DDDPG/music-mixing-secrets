<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">低 Wet 插入路由</title>
<desc id="desc">人声先进入 H-Delay 边界，内部拆为干声支路和 Delay 支路，由 Dry/Wet 混合后输出到混音。Feedback 仅从 Delay 输出回送 Delay 输入。</desc>
<rect id="background" width="1200" height="690" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">插入：在 H-Delay 内部混合</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">人声 → H-Delay → 混音</text>
<rect x="212" y="155" width="779" height="407" rx="14" fill="none" stroke="#dfe3e8" stroke-width="2"/>
<text id="text-3" x="235" y="194" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" text-anchor="start">H-Delay 内部</text>
<text id="text-4" x="56" y="333" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">人声</text>
<line x1="121" y1="323" x2="259" y2="323" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<circle cx="270" cy="323" r="5" fill="#1d1d1f"/>
<path d="M270,323 V245 H828 V286" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<text id="text-5" x="494" y="232" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">干声支路</text>
<path d="M270,323 V391 H381" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<circle cx="356" cy="391" r="4" fill="#0066cc"/>
<rect x="393" y="349" width="227" height="86" rx="6" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-6" x="506.5" y="402" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Delay 支路</text>
<line x1="620" y1="391" x2="764" y2="391" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
<circle cx="658" cy="391" r="5" fill="#0066cc"/>
<path d="M764,391 H828 V360" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M658,391 V492 H356 V394" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text id="text-7" x="506" y="530" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Feedback：取一部分回送</text>
<circle cx="828" cy="323" r="34" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.5"/>
<text id="text-8" x="828" y="335" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="600" text-anchor="middle">+</text>
<text id="text-9" x="862" y="279" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">Dry/Wet</text>
<line x1="865" y1="323" x2="1043" y2="323" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<text id="text-10" x="1080" y="333" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">混音</text>
<text id="text-11" x="56" y="628" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">单声道人声要左右输出：选 M&gt;S；立体声轨选 Stereo。</text>
<text id="text-12" x="56" y="662" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">功能路由示意，非精确 DSP 电路；Dry/Wet 5 不能直接当作电平比或响度比。</text>
</svg>