<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">问题与控制项的诊断对应</title>
<desc id="desc">延迟太抢耳先调 Dry/Wet；后续重复太久先调 Feedback；重复挤住咬字比较 1/8 和 1/16 并检查反馈；低频浑和高频刺分别调 HiPASS/LoPASS。</desc>
<rect id="background" width="1200" height="650" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">听到什么，就先检查对应的控制项</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">带伴奏判断；每次只改变一个条件</text>
<text id="text-3" x="56" y="171" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">延迟声部太抢耳</text>
<line x1="390" y1="161" x2="500" y2="161" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-4" x="545" y="171" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">Dry/Wet</text>
<text id="text-5" x="545" y="210" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">先收小干湿混合</text>
<line x1="56" y1="236" x2="1144" y2="236" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-6" x="56" y="272" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">后续重复拖太久</text>
<line x1="390" y1="262" x2="500" y2="262" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-7" x="545" y="272" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">Feedback</text>
<text id="text-8" x="545" y="311" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">先减少反馈</text>
<line x1="56" y1="337" x2="1144" y2="337" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-9" x="56" y="373" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">重复挤住咬字</text>
<line x1="390" y1="363" x2="500" y2="363" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-10" x="545" y="373" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">1/8 / 1/16</text>
<text id="text-11" x="545" y="412" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">比较时间，再检查反馈</text>
<line x1="56" y1="438" x2="1144" y2="438" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-12" x="56" y="474" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">低频浑 / 高频刺</text>
<line x1="390" y1="464" x2="500" y2="464" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-13" x="545" y="474" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">HiPASS / LoPASS</text>
<text id="text-14" x="545" y="513" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">分别调整，别同时改</text>
<text id="text-15" x="56" y="622" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">诊断顺序是试听建议；没有音频实测，不能保证固定设置一定更宽或更清楚。</text>
</svg>