<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc">
<title id="title">分步试听 Dry/Wet、音符与 Feedback</title>
<desc id="desc">带伴奏循环同一段，固定其他参数比较 Dry/Wet 显示值 0,3,5,8；选定后比较普通 1/8 与 1/16；最后根据延续调整 Feedback。</desc>
<rect id="background" width="1200" height="535" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">固定其他参数，每次只听一件事</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">带伴奏循环同一段 · 不按数字大小预设优劣</text>
<text id="text-3" x="56" y="172" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">1</text>
<text id="text-4" x="108" y="172" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">先比较 Dry/Wet</text>
<circle cx="556" cy="162" r="33" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-5" x="556" y="173" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">0</text>
<line x1="605" y1="162" x2="668" y2="162" stroke="#dfe3e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<circle cx="718" cy="162" r="33" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-6" x="718" y="173" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">3</text>
<line x1="767" y1="162" x2="830" y2="162" stroke="#dfe3e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<circle cx="880" cy="162" r="33" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-7" x="880" y="173" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">5</text>
<line x1="929" y1="162" x2="992" y2="162" stroke="#dfe3e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<circle cx="1042" cy="162" r="33" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-8" x="1042" y="173" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle">8</text>
<line x1="56" y1="231" x2="1144" y2="231" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-9" x="56" y="299" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">2</text>
<text id="text-10" x="108" y="299" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">选好混合后，比音符</text>
<text id="text-11" x="578" y="299" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="start">普通 1/8  ↔  1/16</text>
<line x1="56" y1="358" x2="1144" y2="358" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round"/>
<text id="text-12" x="56" y="422" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">3</text>
<text id="text-13" x="108" y="422" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">最后听后续延续</text>
<text id="text-14" x="578" y="422" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">从 Feedback 20 小幅调整</text>
<text id="text-15" x="56" y="507" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">0 / 3 / 5 / 8 为插件显示值；等大选项不表示电平比、响度比或推荐排名。</text>
</svg>