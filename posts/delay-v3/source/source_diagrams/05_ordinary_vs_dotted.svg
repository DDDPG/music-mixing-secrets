<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">普通 1/8 与 1/8D 的时长</title>
<desc id="desc">固定 160 BPM，普通 1/8 为 187.5 ms；附点 1/8D 为 281.25 ms，是普通时值的 1.5 倍。</desc>
<rect id="background" width="1200" height="390" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">确认普通 1/8，别漏看 D 后缀</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">160 BPM · D = 附点 · 附点时值为普通时值的 1.5 倍</text>
<line x1="330.0" y1="142" x2="330.0" y2="277" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-3" x="330.0" y="314" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">0</text>
<line x1="565.0" y1="142" x2="565.0" y2="277" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-4" x="565.0" y="314" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">100</text>
<line x1="800.0" y1="142" x2="800.0" y2="277" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-5" x="800.0" y="314" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">200</text>
<line x1="1035.0" y1="142" x2="1035.0" y2="277" stroke="#dfe3e8" stroke-width="1.5" stroke-linecap="round"/>
<text id="text-6" x="1035.0" y="314" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">300</text>
<text id="text-7" x="56" y="190" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">普通 1/8</text>
<line x1="330.0" y1="181" x2="770.625" y2="181" stroke="#0066cc" stroke-width="10" stroke-linecap="round"/>
<text id="text-8" x="788.625" y="190" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">187.5 ms</text>
<text id="text-9" x="56" y="261" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">1/8D（附点）</text>
<line x1="330.0" y1="252" x2="990.9375" y2="252" stroke="#7c8997" stroke-width="10" stroke-linecap="round"/>
<text id="text-10" x="1008.9375" y="261" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">281.25 ms</text>
<text id="text-11" x="56" y="362" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">按固定速度计算。H-Delay 手册默认时值为 1/8D；加载预设后也要复核。</text>
</svg>