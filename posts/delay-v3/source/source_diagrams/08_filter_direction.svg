<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">延迟声部的滤波方向</title>
<desc id="desc">对数频率标尺从 20 Hz 到 20 kHz。HiPASS 200 Hz、LoPASS 6 kHz 为试听起点；低频仍浑时试 300 Hz，齿音突出时试 4 kHz。仅示意方向。</desc>
<rect id="background" width="1200" height="660" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">只给延迟声部滤波</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">HiPASS 200 Hz · LoPASS 6 kHz · 试听起点</text>
<text id="text-3" x="88" y="163" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">高通：减少低频</text>
<text id="text-4" x="1112" y="163" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="end">低通：收暗高频</text>
<line x1="421.3333333333333" y1="193" x2="90" y2="193" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="941.5240549443115" y1="193" x2="1110" y2="193" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-5" x="88" y="230" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">向低频侧逐渐衰减</text>
<text id="text-6" x="1112" y="230" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end">向高频侧逐渐衰减</text>
<line x1="88" y1="338" x2="1112" y2="338" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<line x1="88.0" y1="331" x2="88.0" y2="347" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text id="text-7" x="88.0" y="382" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">20</text>
<line x1="326.5817614800277" y1="331" x2="326.5817614800277" y2="347" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text id="text-8" x="326.5817614800277" y="382" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">100</text>
<line x1="667.9150948133611" y1="331" x2="667.9150948133611" y2="347" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text id="text-9" x="667.9150948133611" y="382" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">1k</text>
<line x1="1009.2484281466944" y1="331" x2="1009.2484281466944" y2="347" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text id="text-10" x="1009.2484281466944" y="382" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">10k</text>
<line x1="1112.0" y1="331" x2="1112.0" y2="347" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text id="text-11" x="1112.0" y="382" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">20k</text>
<line x1="429.3333333333333" y1="286" x2="429.3333333333333" y2="338" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
<circle cx="429.3333333333333" cy="338" r="6" fill="#0066cc"/>
<text id="text-12" x="429.3333333333333" y="274" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" text-anchor="middle">HiPASS · 200 Hz</text>
<line x1="933.5240549443115" y1="286" x2="933.5240549443115" y2="338" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
<circle cx="933.5240549443115" cy="338" r="6" fill="#0066cc"/>
<text id="text-13" x="933.5240549443115" y="274" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" text-anchor="middle">LoPASS · 6 kHz</text>
<text id="text-14" x="1112" y="420" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">对数频率 / Hz</text>
<line x1="429.3333333333333" y1="442" x2="489.43914975767257" y2="442" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-15" x="56" y="488" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">低频仍浑：200 → 300 Hz</text>
<line x1="933.5240549443115" y1="442" x2="873.4182385199723" y2="442" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-16" x="684" y="488" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">齿音突出：6 → 4 kHz</text>
<text id="text-17" x="56" y="548" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="start">一次只改一个截止点；太薄或太暗，就往回调。</text>
<text id="text-18" x="56" y="598" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">仅示意滤波方向；截止点外逐渐衰减，不是完全切除。</text>
<text id="text-19" x="56" y="632" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">没有虚构 dB 数值、斜率或实测频响；这里不改动主唱干声的 EQ。</text>
</svg>