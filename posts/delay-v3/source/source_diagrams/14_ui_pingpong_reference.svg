<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">真实 PING PONG 按钮参考</title>
<desc id="desc">从官方产品图裁切的 PING PONG 按钮，仅定位控件，不宣称按钮已开启。</desc>
<rect id="background" width="1200" height="350" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">真实控件参考 · PING PONG</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">只作位置与标签参考，不代表已经开启</text>
<image x="64" y="156" width="322.5" height="127.5" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>
<text id="text-3" x="474" y="191" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start">启用时选 Stereo 或 M&gt;S</text>
<text id="text-4" x="474" y="238" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start">手册要求 Feedback 显示值 &gt; 1</text>
<text id="text-5" x="56" y="322" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">界面局部：Waves 官方产品图 A03。原图非教程设置；© Waves Audio Ltd.</text>
