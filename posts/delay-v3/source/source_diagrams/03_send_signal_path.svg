<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">发送与返回的路由</title>
<desc id="desc">原人声直接进入混音；发送支路经 H-Delay（Dry/Wet 100）返回混音，以发送量或返回推子控制多少。</desc>
<rect id="background" width="1200" height="560" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">发送：原人声直达混音</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">效果轨只返回处理后的信号；用发送量或返回推子调多少</text>
<text id="text-3" x="56" y="221" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">人声</text>
<line x1="128" y1="211" x2="982" y2="211" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<circle cx="259" cy="211" r="5" fill="#1d1d1f"/>
<text id="text-4" x="1080" y="221" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">混音</text>
<circle cx="1012" cy="211" r="28" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.5"/>
<text id="text-5" x="1012" y="222" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" text-anchor="middle">+</text>
<line x1="1041" y1="211" x2="1060" y2="211" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<path d="M259,211 V370 H458" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text id="text-6" x="315" y="348" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="start">发送量</text>
<rect x="474" y="314" width="264" height="114" rx="6" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text id="text-7" x="606" y="354" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle">H-Delay 效果轨</text>
<text id="text-8" x="606" y="395" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Dry/Wet 100</text>
<line x1="740" y1="370" x2="977" y2="370" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text id="text-9" x="846" y="348" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" text-anchor="middle">返回推子</text>
<path d="M991,370 H1012 V248" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text id="text-10" x="56" y="498" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">常规发送路由：效果轨 Dry/Wet 设为 100，避免额外返回干声。</text>
<text id="text-11" x="56" y="532" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">功能路由示意；此图与低 Wet 插入是两种不同用法。</text>
</svg>