<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc">
<title id="title">Feedback 理想模型中的振幅衰减</title>
<desc id="desc">首个延迟信号振幅统一为 100。模型 g=0.3：100,30,9,2.7。g=0.6：100,60,36,21.6。第 4 次相差 8 倍振幅，并非响度比或插件读数。</desc>
<rect id="background" width="1200" height="715" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker>
<marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#1d1d1f" stroke-width="1.3"/></marker>
<marker id="arrow-second" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#7c8997" stroke-width="1.3"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#62666d" stroke-width="1.3"/></marker>
</defs>
<text id="text-1" x="56" y="58" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start">Feedback 影响后续重复的衰减</text>
<text id="text-2" x="56" y="100" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">相对振幅：第 1 次 = 100 · 两组同一纵轴尺度</text>
<text id="text-3" x="65" y="151" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">模型 g = 0.3</text>
<text id="text-4" x="65" y="184" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">每次回送 30% 振幅</text>
<line x1="94" y1="485.0" x2="478" y2="485.0" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-5" x="78" y="492.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">0</text>
<line x1="94" y1="372.5" x2="478" y2="372.5" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-6" x="78" y="379.5" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">50</text>
<line x1="94" y1="260.0" x2="478" y2="260.0" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-7" x="78" y="267.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">100</text>
<line x1="121" y1="485" x2="121" y2="260.0" stroke="#7c8997" stroke-width="11" stroke-linecap="round"/>
<circle cx="121" cy="260.0" r="6" fill="#7c8997"/>
<text id="text-8" x="121" y="244.0" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">100</text>
<text id="text-9" x="121" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 1 次</text>
<line x1="229" y1="485" x2="229" y2="417.5" stroke="#7c8997" stroke-width="11" stroke-linecap="round"/>
<circle cx="229" cy="417.5" r="6" fill="#7c8997"/>
<text id="text-10" x="229" y="401.5" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">30</text>
<text id="text-11" x="229" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 2 次</text>
<line x1="337" y1="485" x2="337" y2="464.75" stroke="#7c8997" stroke-width="11" stroke-linecap="round"/>
<circle cx="337" cy="464.75" r="6" fill="#7c8997"/>
<text id="text-12" x="337" y="448.75" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">9</text>
<text id="text-13" x="337" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 3 次</text>
<line x1="445" y1="485" x2="445" y2="478.925" stroke="#7c8997" stroke-width="11" stroke-linecap="round"/>
<circle cx="445" cy="478.925" r="6" fill="#7c8997"/>
<text id="text-14" x="445" y="462.925" fill="#7c8997" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">2.7</text>
<text id="text-15" x="445" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 4 次</text>
<text id="text-16" x="658" y="151" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">模型 g = 0.6</text>
<text id="text-17" x="658" y="184" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">每次回送 60% 振幅</text>
<line x1="687" y1="485.0" x2="1071" y2="485.0" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-18" x="671" y="492.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">0</text>
<line x1="687" y1="372.5" x2="1071" y2="372.5" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-19" x="671" y="379.5" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">50</text>
<line x1="687" y1="260.0" x2="1071" y2="260.0" stroke="#dfe3e8" stroke-width="1.3" stroke-linecap="round"/>
<text id="text-20" x="671" y="267.0" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end">100</text>
<line x1="714" y1="485" x2="714" y2="260.0" stroke="#0066cc" stroke-width="11" stroke-linecap="round"/>
<circle cx="714" cy="260.0" r="6" fill="#0066cc"/>
<text id="text-21" x="714" y="244.0" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">100</text>
<text id="text-22" x="714" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 1 次</text>
<line x1="822" y1="485" x2="822" y2="350.0" stroke="#0066cc" stroke-width="11" stroke-linecap="round"/>
<circle cx="822" cy="350.0" r="6" fill="#0066cc"/>
<text id="text-23" x="822" y="334.0" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">60</text>
<text id="text-24" x="822" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 2 次</text>
<line x1="930" y1="485" x2="930" y2="404.0" stroke="#0066cc" stroke-width="11" stroke-linecap="round"/>
<circle cx="930" cy="404.0" r="6" fill="#0066cc"/>
<text id="text-25" x="930" y="388.0" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">36</text>
<text id="text-26" x="930" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 3 次</text>
<line x1="1038" y1="485" x2="1038" y2="436.4" stroke="#0066cc" stroke-width="11" stroke-linecap="round"/>
<circle cx="1038" cy="436.4" r="6" fill="#0066cc"/>
<text id="text-27" x="1038" y="420.4" fill="#0066cc" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle">21.6</text>
<text id="text-28" x="1038" y="529" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">第 4 次</text>
<text id="text-29" x="56" y="590" fill="#1d1d1f" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">第 4 次：21.6 ÷ 2.7 = 8 倍振幅</text>
<text id="text-30" x="56" y="653" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">理想线性模型：第 n 次振幅 = 100 × g⁽ⁿ⁻¹⁾，不含滤波和饱和。</text>
<text id="text-31" x="56" y="687" fill="#62666d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">不是 H-Delay 旋钮读数或实测；振幅倍数不等于响度倍数。</text>
</svg>