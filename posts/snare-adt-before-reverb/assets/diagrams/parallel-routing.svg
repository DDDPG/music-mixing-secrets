<svg xmlns="http://www.w3.org/2000/svg" width="936" height="520" viewBox="0 0 936 520"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0066cc" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans SC,sans-serif" fill="#1d1d1f"><text x="0" y="38" font-size="32" fill="#1d1d1f">并联路径示意：干声绕开 ADT，空间单独处理</text><rect x="0" y="85" width="170" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/><text x="20" y="135.0" font-size="30" fill="#1d1d1f">Snare</text><path d="M170 125 L750 125" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arr)"/><rect x="765" y="85" width="170" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/><text x="785" y="135.0" font-size="30" fill="#1d1d1f">Mix Bus</text><text x="340" y="100" font-size="28" fill="#697887">Dry：居中</text><path d="M110 165 L110 265 L175 265" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arr)"/><text x="0" y="220" font-size="28" fill="#0066cc">Send</text><rect x="190" y="225" width="210" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/><text x="210" y="275.0" font-size="30" fill="#1d1d1f">Reel ADT</text><path d="M400 265 L470 265" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arr)"/><rect x="485" y="225" width="245" height="80" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/><text x="505" y="275.0" font-size="30" fill="#1d1d1f">Stereo Reverb</text><text x="499" y="347" font-size="28" fill="#0066cc">100% Wet</text><path d="M730 265 L850 265 L850 175" fill="none" stroke="#0066cc" stroke-width="3" marker-end="url(#arr)"/><text x="0" y="430" font-size="28" fill="#1d1d1f">SRC + ADT 是混响的输入材料；最终返回只保留混响。</text><text x="0" y="479" font-size="25" fill="#697887">假设 DAW 路由与延迟补偿正确；具体插件输入结构另核对。</text></g></svg>