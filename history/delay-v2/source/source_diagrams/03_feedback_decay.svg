<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc">
<title id="title">理想反馈模型中的振幅衰减</title>
<desc id="desc">把第 1 次回声归一到 100。回送 30% 振幅时为 100、30、9、2.7；回送 60% 时为 100、60、36、21.6。第 4 次的相对振幅相差 8 倍。这不是 H-Delay 测量。</desc>
<rect width="1200" height="715" fill="#F7F4EE"/>
<defs><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#177D78" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#263335" stroke-width="1.4"/></marker><marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#C86451" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#506FB0" stroke-width="1.4"/></marker><linearGradient id="low-fade"><stop offset="0%" stop-color="#C86451" stop-opacity=".12"/><stop offset="100%" stop-color="#C86451" stop-opacity="0"/></linearGradient><linearGradient id="high-fade"><stop offset="0%" stop-color="#506FB0" stop-opacity="0"/><stop offset="100%" stop-color="#506FB0" stop-opacity=".12"/></linearGradient></defs>
<text x="60" y="62" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start" >反馈改变后续重复的衰减</text>
<text x="60" y="106" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >相对振幅（第 1 次 = 100）· 两组使用同一纵轴尺度</text>
<text x="80" y="160" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start" >每次回送 30% 振幅</text>
<line x1="94" y1="499.0" x2="480" y2="499.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="77" y="506.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >0</text>
<line x1="94" y1="363.0" x2="480" y2="363.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="77" y="370.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >50</text>
<line x1="94" y1="227.0" x2="480" y2="227.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="77" y="234.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >100</text>
<line x1="120" y1="499" x2="120" y2="227.0" stroke="#177D78" stroke-width="13" stroke-linecap="round"/>
<circle cx="120" cy="227.0" r="7" fill="#177D78"/>
<text x="120" y="209.0" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >100</text>
<text x="120" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 1 次</text>
<line x1="228" y1="499" x2="228" y2="417.4" stroke="#177D78" stroke-width="13" stroke-linecap="round"/>
<circle cx="228" cy="417.4" r="7" fill="#177D78"/>
<text x="228" y="399.4" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >30</text>
<text x="228" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 2 次</text>
<line x1="336" y1="499" x2="336" y2="474.52" stroke="#177D78" stroke-width="13" stroke-linecap="round"/>
<circle cx="336" cy="474.52" r="7" fill="#177D78"/>
<text x="336" y="456.52" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >9</text>
<text x="336" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 3 次</text>
<line x1="444" y1="499" x2="444" y2="491.656" stroke="#177D78" stroke-width="13" stroke-linecap="round"/>
<circle cx="444" cy="491.656" r="7" fill="#177D78"/>
<text x="444" y="473.656" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >2.7</text>
<text x="444" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 4 次</text>
<text x="670" y="160" fill="#C86451" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start" >每次回送 60% 振幅</text>
<line x1="684" y1="499.0" x2="1070" y2="499.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="667" y="506.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >0</text>
<line x1="684" y1="363.0" x2="1070" y2="363.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="667" y="370.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >50</text>
<line x1="684" y1="227.0" x2="1070" y2="227.0" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="667" y="234.0" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="end" >100</text>
<line x1="710" y1="499" x2="710" y2="227.0" stroke="#C86451" stroke-width="13" stroke-linecap="round"/>
<circle cx="710" cy="227.0" r="7" fill="#C86451"/>
<text x="710" y="209.0" fill="#C86451" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >100</text>
<text x="710" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 1 次</text>
<line x1="818" y1="499" x2="818" y2="335.79999999999995" stroke="#C86451" stroke-width="13" stroke-linecap="round"/>
<circle cx="818" cy="335.79999999999995" r="7" fill="#C86451"/>
<text x="818" y="317.79999999999995" fill="#C86451" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >60</text>
<text x="818" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 2 次</text>
<line x1="926" y1="499" x2="926" y2="401.08" stroke="#C86451" stroke-width="13" stroke-linecap="round"/>
<circle cx="926" cy="401.08" r="7" fill="#C86451"/>
<text x="926" y="383.08" fill="#C86451" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >36</text>
<text x="926" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 3 次</text>
<line x1="1034" y1="499" x2="1034" y2="440.248" stroke="#C86451" stroke-width="13" stroke-linecap="round"/>
<circle cx="1034" cy="440.248" r="7" fill="#C86451"/>
<text x="1034" y="422.248" fill="#C86451" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >21.6</text>
<text x="1034" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >第 4 次</text>
<text x="60" y="603" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" >第 4 次：21.6 ÷ 2.7 = 8 倍振幅</text>
<text x="60" y="652" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >理想线性模型：第 n 次 = 100 × g⁽ⁿ⁻¹⁾。</text>
<text x="60" y="688" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >相对振幅不代表听感响度，也不是 H-Delay 某旋钮值的实测。</text>
</svg>