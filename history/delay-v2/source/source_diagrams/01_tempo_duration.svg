<circle cx="551.875" cy="460" r="7" fill="#506FB0"/>
<text x="573.875" y="470" fill="#506FB0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >93.75 ms</text>
<text x="60" y="603" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >120 → 160 BPM：同一音符时长缩短 25%</text>
<text x="60" y="641" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >1/8 = 60,000 ÷ BPM ÷ 2</text>
<text x="620" y="641" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >1/16 = 60,000 ÷ BPM ÷ 4</text>
