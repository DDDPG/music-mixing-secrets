<text x="238" y="469" fill="#506FB0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="end" >1/16</text>
<line x1="280.0" y1="460" x2="551.875" y2="460" stroke="#506FB0" stroke-width="16" stroke-linecap="round"/>
