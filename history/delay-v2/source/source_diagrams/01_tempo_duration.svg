<text x="715.0" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >150</text>
<line x1="860.0" y1="157" x2="860.0" y2="495" stroke="#DCDDD5" stroke-width="1.5" stroke-linecap="round"/>
<text x="860.0" y="542" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" >200</text>
