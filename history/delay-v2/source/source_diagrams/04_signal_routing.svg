<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">插入与发送路由的差异</title>
<desc id="desc">插入模式在人声轨的插件内部混合干声与回声。发送模式让原人声直达混音，并将发送支路经百分之百湿声的效果轨返回混音。</desc>
<rect width="1200" height="830" fill="#F7F4EE"/>
<defs><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#177D78" stroke-width="1.4"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#263335" stroke-width="1.4"/></marker><marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#C86451" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L7,4 L0,7" fill="none" stroke="#506FB0" stroke-width="1.4"/></marker><linearGradient id="low-fade"><stop offset="0%" stop-color="#C86451" stop-opacity=".12"/><stop offset="100%" stop-color="#C86451" stop-opacity="0"/></linearGradient><linearGradient id="high-fade"><stop offset="0%" stop-color="#506FB0" stop-opacity="0"/><stop offset="100%" stop-color="#506FB0" stop-opacity=".12"/></linearGradient></defs>
<text x="60" y="62" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="start" >回声在哪里混入？</text>
<text x="60" y="106" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >两种常见路由 · 功能概念示意</text>
<text x="60" y="171" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" >插入</text>
<text x="169" y="171" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" >用插件的 Dry/Wet 调整干湿</text>
<rect x="257" y="205" width="617" height="228" rx="18" fill="none" stroke="#DCDDD5" stroke-width="2"/>
<text x="277" y="240" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >延迟插件内部</text>
<text x="59" y="333" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >人声</text>
<line x1="133" y1="323" x2="293" y2="323" stroke="#263335" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<circle cx="310" cy="323" r="5" fill="#263335"/>
<path d="M310,323 V278 H741 V292" fill="none" stroke="#263335" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path d="M310,323 V375 H741 V354" fill="none" stroke="#177D78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="463" y="267" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle" >干声支路</text>
<text x="463" y="361" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" text-anchor="middle" >延迟回声支路</text>
<circle cx="741" cy="323" r="27" fill="#F7F4EE" stroke="#263335" stroke-width="2.5"/>
<text x="741" y="333" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >+</text>
<text x="741" y="418" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" >Dry/Wet</text>
<line x1="773" y1="323" x2="1042" y2="323" stroke="#263335" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<text x="1071" y="333" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >混音</text>
<text x="60" y="509" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" >发送</text>
<text x="169" y="509" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" >插件 100% Wet · 用发送量或返回推子调整</text>
<text x="59" y="591" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >人声</text>
<line x1="134" y1="581" x2="976" y2="581" stroke="#263335" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<text x="1071" y="591" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" text-anchor="start" >混音</text>
<circle cx="264" cy="581" r="5" fill="#263335"/>
<path d="M264,581 V683 H487" fill="none" stroke="#177D78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="312" y="665" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="start" >发送量</text>
<text x="577" y="671" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="middle" >效果轨</text>
<text x="577" y="711" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" >100% Wet</text>
<line x1="668" y1="683" x2="939" y2="683" stroke="#177D78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<text x="774" y="665" fill="#177D78" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="600" text-anchor="middle" >返回推子</text>
<path d="M960,683 H1002 V609" fill="none" stroke="#177D78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<circle cx="1002" cy="581" r="25" fill="#F7F4EE" stroke="#263335" stroke-width="2.5"/>
<text x="1002" y="591" fill="#263335" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle" >+</text>
<line x1="1029" y1="581" x2="1046" y2="581" stroke="#263335" stroke-width="3" stroke-linecap="round"/>
<text x="60" y="792" fill="#65716E" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >功能路由示意，不代表插件内部的精确 DSP 电路。</text>
</svg>